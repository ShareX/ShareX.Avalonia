name: Release Build (All Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_title: ${{ steps.version.outputs.release_title }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props | tr -d '[:space:]')
          if [[ -z "$VERSION" ]]; then
            echo "Failed to resolve <Version> from Directory.Build.props"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' must follow x.y.z format."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '${GITHUB_REF_NAME}' must follow vX.Y.Z format."
              exit 1
            fi

            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "Tag version '$TAG_VERSION' does not match Directory.Build.props version '$VERSION'"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_title=XerahS $VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: validate-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $isccPath)) {
            choco install innosetup --no-progress -y
          }
          if (!(Test-Path $isccPath)) {
            throw "Inno Setup Compiler (ISCC.exe) was not found after installation."
          }

      - name: Build Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/logs | Out-Null
          $logPath = "build/logs/windows-build.log"
          Start-Transcript -Path $logPath -Force | Out-Null
          try {
            .\build\windows\package-windows.ps1
          }
          finally {
            Stop-Transcript | Out-Null
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/XerahS-${{ needs.validate-version.outputs.version }}-win-x64.exe
            dist/XerahS-${{ needs.validate-version.outputs.version }}-win-arm64.exe

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          if-no-files-found: warn
          path: build/logs/windows-build.log

  build-macos:
    needs: validate-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build macOS packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          chmod +x ./build/macos/package-mac.sh
          ./build/macos/package-mac.sh 2>&1 | tee build/logs/macos-build.log

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/XerahS-${{ needs.validate-version.outputs.version }}-mac-arm64.tar.gz
            dist/XerahS-${{ needs.validate-version.outputs.version }}-mac-x64.tar.gz

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          if-no-files-found: warn
          path: build/logs/macos-build.log

  build-linux:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            artifact_name: linux-release-x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: linux-release-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install RPM tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils

      - name: Build Linux packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          chmod +x ./build/linux/package-linux.sh
          XERAHS_ARCHITECTURES="${{ matrix.rid }}" ./build/linux/package-linux.sh 2>&1 | tee "build/logs/linux-${{ matrix.rid }}-build.log"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.tar.gz
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.deb
            dist/XerahS-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}.rpm

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log-${{ matrix.rid }}
          if-no-files-found: warn
          path: build/logs/linux-${{ matrix.rid }}-build.log

  release:
    if: github.ref_type == 'tag'
    needs:
      - validate-version
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.validate-version.outputs.release_title }}
          files: |
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-x64.exe
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-win-arm64.exe
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-mac-arm64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-mac-x64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.deb
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-x64.rpm
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.tar.gz
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.deb
            release-assets/XerahS-${{ needs.validate-version.outputs.version }}-linux-arm64.rpm
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
